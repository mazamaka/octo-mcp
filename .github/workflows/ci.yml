name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag past v7, so pin the exact version
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # both matrix jobs run in parallel and would race for one cache key
          cache-suffix: py${{ matrix.python-version }}

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/ tests/

      - name: Test
        run: uv run pytest
